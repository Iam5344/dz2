<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>

<body>

  <script>
    function multiplyAsync(a, b) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (typeof a !== 'number' || typeof b !== 'number' || isNaN(a) || isNaN(b)) {
            reject(new Error("Некоректні значення"));
          } else {
            resolve(a * b);
          }
        }, 2000);
      });
    }
    function sortArrayAsync(array) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (!Array.isArray(array) || array.length === 0) {
            reject(new Error("Масив порожній"));
          } else {
            const sortedArray = [...array].sort((a, b) => a - b);
            resolve(sortedArray);
          }
        }, 2000);
      });
    }
    async function main() {
      console.log("--- Завдання 1 ---");
      try {
        const result = await multiplyAsync(6, 9);
        console.log("Результат множення:", result);
      } catch (error) {
        console.error("Помилка:", error.message);
      }

      console.log("\n--- Завдання 2 ---");
      try {
        const numbers = [42, 7, 19, 3, 88, 1];
        const sorted = await sortArrayAsync(numbers);
        console.log("Відсортований масив:", sorted);
      } catch (error) {
        console.error("Помилка:", error.message);
      }
    }

    main();
  </script>
</body>

</html>
